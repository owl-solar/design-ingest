[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "design-ingest"
version = "0.6.0"
description = "Read engineering design inputs (PDF, DOCX, XLSX/CSV, DXF/DWG, KMZ/KML, PVsyst PAN/OND) into one structured format for analysis and LLM/RAG pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marharyta Cherkashyna" }]
keywords = ["solar", "pv", "bess", "pvsyst", "dxf", "pdf", "rag", "document-parsing"]
dependencies = [
    "pydantic>=2.5",
    "pdfplumber>=0.10",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
pandas = ["pandas>=2.0"]
embeddings = ["fastembed>=0.3"]
dev = ["pytest>=8", "reportlab>=4", "pandas>=2.0"]
all = ["anthropic>=0.40", "pandas>=2.0"]

[project.scripts]
design-ingest = "design_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
